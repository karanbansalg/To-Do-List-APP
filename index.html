<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do_APP</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="container">
        <div class="inside">
            <div class="header sticky">
                <h1 class="font-bold text-4xl">My Tasks</h1><br>
                <p class="text-gray-500">Stay organised and productive.</p>
            </div>
            <div class="main">
                <div class="section1">
                <input id="task" class="bg-white" type="text" placeholder="What needs to be done?">
                <button class="taskBtn bg-purple-500 rounded-sm text-white cursor-pointer">Add Task</button>
                </div>
                <ul class="ul">
                    <li class="taskItem rounded-[10px] flex bg-white items-center justify-around h-[50px] w-[100%]">
                        <input class="checkbox cursor-pointer" type="checkbox" >
                        <div class="textContent"></div>
                        <button class="delBtn cursor-pointer bg-red-500 h-[30px] w-[60px] rounded-sm text-white">delete</button> 
                    </li>
                </ul>
            </div>
            <div class="footer sticky">
                <p class="text-gray-500"><span class="taskCounter">0</span>tasks</p>
                <p class="text-gray-500"><span class="completionCounter">0</span>completed</p>
            </div>
        </div>
    </div>
    <script src="app.js" ></script>
</body>
</html>
