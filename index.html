<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do_APP</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     <div class="section1 w-[85%]">
                <input id="task" class="bg-white " type="text" placeholder="What needs to be done?">
                <button class="taskBtn bg-purple-500 rounded-sm text-white cursor-pointer">Add Task</button>
                </div>
    <div class="container">
        <div class="to-do">
            <div class="header ">
                <h1 class="font-bold text-4xl">My Tasks</h1><br>
                <p class="text-gray-500">Stay organised and productive.</p>
            </div>
            <div class="main">
                <ul class="ul">
                </ul>
            </div>        
        </div>
        <div class="progress">
          <h1 class="font-bold text-4xl">Tasks in progress...</h1>
          <div class="main2"><ul class="ul2">
                </ul></div>
        </div>
        <div class="completed">
          <h1 class="font-bold text-4xl">Tasks Completed</h1>
          <div class="main3"><ul class="ul3">

          </ul></div>
        </div>
    </div>
    <script src="app.js" ></script>
</body>
</html>
